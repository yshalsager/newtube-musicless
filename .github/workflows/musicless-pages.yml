name: Publish Musicless site

# Publishes site/ (the Arabic landing page) to GitHub Pages:
# https://yshalsager.github.io/newtube-musicless/
# The download buttons find the latest release's APKs at load time, so releases need no rebuild.

on:
  push:
    branches: [musicless]
    paths:
      - "site/**"
      - ".github/workflows/musicless-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicless-pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs, like GitHub's template: deploying in the uploading job
  # started failing with "No artifacts named github-pages" before the upload became visible.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
