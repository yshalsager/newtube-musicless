name: Build Musicless release

# Builds the signed NewTube Musicless APKs (the fork build: its own app id, icon, defaults and
# update feed) from a tag like v1.17.1-musicless.2, and attaches them, SHA256SUMS and the
# updater's musicless.json to a DRAFT release. Publishing the draft (as a normal release, not a
# pre-release: the app reads releases/latest/download/musicless.json) is a manual step.
#
# The tag is <upstream versionName>-musicless.<fork build>; the fork build becomes -PforkBuild,
# so versionCode = upstream code * 100 + build. The tag message's lines become the release notes and
# in-app changelog: lines starting "ar: " are the Arabic ones, the rest English.
#
# Secrets, in the `musicless-release` environment: MUSICLESS_KEYSTORE_BASE64 (the .p12, base64),
# MUSICLESS_KEYSTORE_PASSWORD (store and key password) and MUSICLESS_KEY_ALIAS.
#
# Publishing the release runs the announce job: tools/musicless_telegram.py posts the Arabic
# changelog and download links to a Telegram channel. Configure it in the `telegram` environment
# (not musicless-release, which keeps the signing key to release tags; a manual run starts from
# the branch): TELEGRAM_BOT_TOKEN (secret; the bot must be an admin of the channel) and
# TELEGRAM_CHAT_ID (variable or secret: @channel or -100...). Without both it posts nothing.
# Run the workflow by hand with a tag to post a published release again.

on:
  push:
    tags: ["v*-musicless.*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release to post to Telegram, e.g. v1.17.1-musicless.5"
        required: true

permissions:
  contents: read

concurrency:
  group: musicless-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: musicless-release
    permissions:
      contents: write      # create the draft release
      id-token: write      # sign the attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      # SHA-256 of the certificate every NewTube Musicless release is signed with.
      EXPECTED_CERT: 1490631944f31de3697ef4df013971d729adfa3c888c4a5360d57e4c5b29f741
      APP_ID: io.github.yshalsager.newtube.musicless
      MODELS_URL: https://github.com/yshalsager/newtube-musicless/releases/download/musicless-models-v1
      NDK_VERSION: 21.0.6113669   # smarttubetv/build.gradle ndkVersion (strips the .so files)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Read the tag
        run: |
          set -euo pipefail
          base="${TAG#v}"; base="${base%-musicless.*}"
          build="${TAG##*-musicless.}"
          case "$build" in ''|*[!0-9]*) echo "::error::$TAG must end in -musicless.<number>."; exit 1 ;; esac
          grep -q "versionName \"$base\"" smarttubetv/build.gradle \
            || { echo "::error::smarttubetv/build.gradle has no versionName $base for $TAG."; exit 1; }
          code=$(grep -oE "versionCode [0-9]+" smarttubetv/build.gradle | tail -1 | awk '{print $2}')
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "FORK_BUILD=$build" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((code * 100 + build))" >> "$GITHUB_ENV"
          # The annotated tag's message (checkout fetched only the commit).
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/^-----BEGIN/,$d' | grep -v '^\s*$' > "$RUNNER_TEMP/all.txt" || true
          grep -v '^ar: ' "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/notes.txt" || true
          grep '^ar: ' "$RUNNER_TEMP/all.txt" | sed 's/^ar: //' > "$RUNNER_TEMP/notes_ar.txt" || true
          # Release notes: English, then Arabic.
          { sed 's/^/- /' "$RUNNER_TEMP/notes.txt"
            if [ -s "$RUNNER_TEMP/notes_ar.txt" ]; then echo; echo '---'; echo; sed 's/^/- /' "$RUNNER_TEMP/notes_ar.txt"; fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the NDK
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICLESS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MUSICLESS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSICLESS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The musicless-release environment has no MUSICLESS_KEYSTORE_BASE64 secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/musicless.p12"
          {
            echo "storeFile=$RUNNER_TEMP/musicless.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build the release APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileRelease \
            -PforkAppId="$APP_ID" -PforkBuild="$FORK_BUILD" \
            -PforkUpdateUrl="https://github.com/$REPO/releases/latest/download/musicless.json" \
            -PmusiclessModelBaseUrl="$MODELS_URL"
          mkdir dist
          cp smarttubetv/build/outputs/renamed_apks/stmobileRelease/NewTube_*.apk dist/

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/musicless.p12"

      - name: Check names, version and signature
        run: |
          set -euo pipefail
          ls -l dist
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/[0-9]* | sort -V | tail -1)/apksigner"
          aapt2="$(dirname "$apksigner")/aapt2"
          for apk in dist/*.apk; do
            case "$(basename "$apk")" in
              "NewTube_${TAG#v}_"*) ;;
              *) echo "::error::$(basename "$apk") doesn't match tag $TAG."; exit 1 ;;
            esac
            "$aapt2" dump badging "$apk" | grep -q "^package: name='$APP_ID' versionCode='$VERSION_CODE'" \
              || { echo "::error::$(basename "$apk") is not $APP_ID versionCode $VERSION_CODE."; exit 1; }
            out="$("$apksigner" verify --print-certs "$apk" 2>&1)" || { echo "$out"; echo "::error::apksigner rejected $(basename "$apk")."; exit 1; }
            certs="$(printf '%s\n' "$out" | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $4}' | sort -u)"
            if [ "$certs" != "$EXPECTED_CERT" ]; then
              echo "::error::$(basename "$apk") is signed with '${certs}', not the Musicless certificate."
              exit 1
            fi
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Write the update manifest
        run: |
          set -euo pipefail
          notes=()
          while IFS= read -r line; do notes+=(--note "$line"); done < "$RUNNER_TEMP/notes.txt"
          while IFS= read -r line; do notes+=(--note-ar "$line"); done < "$RUNNER_TEMP/notes_ar.txt"
          python3 tools/musicless_manifest.py --repo "$REPO" --tag "$TAG" --code "$VERSION_CODE" \
            --dist dist --out dist/musicless.json "${notes[@]}"
          cat dist/musicless.json

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            if [ "$(cat draft.txt)" != "true" ]; then
              echo "::error::Release $TAG is already published; not replacing its files."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "NewTube Musicless ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  announce:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.prerelease &&
       contains(github.event.release.tag_name, '-musicless.'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: telegram
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
          persist-credentials: false

      - name: Post to Telegram
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::No TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID in the telegram environment; nothing posted."
            exit 0
          fi
          python3 tools/musicless_telegram.py "$TAG"
